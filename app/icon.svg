<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark as app/components/Logo.tsx: an ink tile, the thread running
       through three moments, and the present one in the accent blue. It
       inverts with the system theme, as the in-app mark does. -->
  <style>
    .tile { fill: #111114 }
    .ink { fill: #ffffff; stroke: #ffffff }
    .now { fill: #0a6cff }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f4f4f5 }
      .ink { fill: #141417; stroke: #141417 }
      .now { fill: #4b93ff }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="9"/>
  <path class="ink" d="M8 23 Q12 9 16 16 Q20 23 24 9" stroke-width="2.25" stroke-linecap="round" fill="none" style="fill:none"/>
  <circle class="ink" cx="8" cy="23" r="2.4" stroke-width="0"/>
  <circle class="now" cx="16" cy="16" r="2.4"/>
  <circle class="ink" cx="24" cy="9" r="2.4" stroke-width="0"/>
</svg>
